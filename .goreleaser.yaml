project_name: skypaw

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/skypaw
    binary: skypaw
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -w -s
      - -X 'github.com/zenpaw-labs/skypaw/cmd.semVersion=v1.1.0'

archives:
  - format: binary
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: skypaw
    package_name: skypaw
    file_name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    maintainer: mykhailo <mykkhailo@protonmail.com>
    description: Minimal weather CLI for the terminal
    homepage: https://github.com/zenpaw-labs/skypaw
    license: MIT
    formats:
      - deb
      - rpm

checksum:
  name_template: "checksums.txt"
